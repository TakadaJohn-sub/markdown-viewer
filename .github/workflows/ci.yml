name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Electron/macOS-specific behavior (sandboxing, native menu roles, file
    # associations) only runs correctly on a real macOS host.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:e2e
