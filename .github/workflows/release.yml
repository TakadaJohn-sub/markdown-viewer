name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:e2e

      # --publish never: electron-builder otherwise auto-publishes on tag builds and demands
      # GH_TOKEN; the release is created explicitly by the step below instead.
      - name: Build macOS (universal) and Windows (x64 + arm64) distributables
        run: |
          npx vite build
          npx electron-builder --mac --universal --publish never
          npx electron-builder --win --x64 --arm64 --publish never

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "release/${VERSION}/Markdown Viewer-${VERSION}-universal.dmg" \
            "release/${VERSION}/Markdown Viewer-${VERSION}-universal-mac.zip" \
            "release/${VERSION}/Markdown Viewer-${VERSION}-win.zip" \
            "release/${VERSION}/Markdown Viewer-${VERSION}-arm64-win.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes "**Install:** macOS builds are not code-signed yet — right-click the app and choose Open the first time. Windows builds (\`*-win.zip\`) are early support: extract and run \`Markdown Viewer.exe\`. See the README for details." \
            --generate-notes
